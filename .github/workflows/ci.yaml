
name: GameVault CI

on:
  push:
    branches:
      - develop
      - staging
  pull_request:
    branches:
      - develop
      - staging

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore GameDBWebApi.Tests/GameDBWebApi.Tests.csproj

      - name: Build solution
        run: dotnet build GameDBWebApi.Tests/GameDBWebApi.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test GameDBWebApi.Tests/GameDBWebApi.Tests.csproj --configuration Release --no-build
